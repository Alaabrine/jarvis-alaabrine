[project]
name = "jarvis"
version = "0.1.0"
description = "JARVIS - a self-hosted butler-style AI agent with full device control."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "openai>=1.40",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "psutil>=6.0",
    "python-multipart>=0.0.9",
    "pillow>=10.0",
    "edge-tts>=7.0",
    "faster-whisper>=1.1",
]

[project.scripts]
jarvis = "jarvis.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["jarvis"]
